spring.application.name=Portail_de_suivi_du_doctorat 

spring.h2.console.enabled=true

spring.datasource.url=jdbc:h2:mem:Portail
spring.datasource.username=user
spring.datasource.password=123

spring.jpa.defer-datasource-initialization=true  # Hibernate crée les tables d'abord
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data-h2.sql