<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Connexion — Portail Doctorat</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet"/>
    <style>
        body { font-family:'DM Sans',sans-serif; margin:0; }
        h1,h2,h3,.brand { font-family:'Sora',sans-serif; }
        .auth-page {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a56db 0%, #0ea5e9 100%);
            display: flex; align-items: center; justify-content: center;
            position: relative; overflow: hidden;
        }
        /* décorations géométriques */
        .auth-page::before, .auth-page::after {
            content:''; position:absolute; border-radius:50%; opacity:.12;
        }
        .auth-page::before { width:500px;height:500px;background:#fff;top:-150px;right:-150px; }
        .auth-page::after  { width:300px;height:300px;background:#fff;bottom:-80px;left:-80px; }
        .auth-card {
            background: #fff; border-radius: 20px; padding: 2.5rem 2.25rem;
            width: 100%; max-width: 420px; position: relative; z-index: 1;
            box-shadow: 0 24px 60px rgba(0,0,0,.2);
        }
        .auth-logo { text-align:center; margin-bottom:1.75rem; }
        .auth-logo .icon-wrap {
            width:64px;height:64px;background:linear-gradient(135deg,#1a56db,#0ea5e9);
            border-radius:16px;display:inline-flex;align-items:center;justify-content:center;
            font-size:1.8rem;color:#fff;margin-bottom:.75rem;
            box-shadow:0 8px 20px rgba(26,86,219,.3);
        }
        .auth-logo h1 { font-size:1.3rem;font-weight:700;color:#0f172a;margin:0; }
        .auth-logo p  { font-size:.85rem;color:#64748b;margin:.25rem 0 0; }
        .form-label { font-size:.85rem;font-weight:500;color:#374151;margin-bottom:.35rem; }
        .form-control {
            border-radius:10px;border:1.5px solid #e2e8f0;padding:.65rem .9rem;
            font-size:.9rem;transition:border-color .2s,box-shadow .2s;
        }
        .form-control:focus { border-color:#1a56db;box-shadow:0 0 0 3px rgba(26,86,219,.12);outline:none; }
        .btn-login {
            width:100%;background:linear-gradient(135deg,#1a56db,#0ea5e9);
            border:none;color:#fff;border-radius:10px;padding:.75rem;
            font-size:.95rem;font-weight:600;font-family:'Sora',sans-serif;
            cursor:pointer;transition:opacity .2s,transform .1s;
        }
        .btn-login:hover { opacity:.92;transform:translateY(-1px); }
        .divider { text-align:center;color:#94a3b8;font-size:.8rem;margin:1.1rem 0;position:relative; }
        .divider::before,.divider::after {
            content:'';position:absolute;top:50%;width:40%;height:1px;background:#e2e8f0;
        }
        .divider::before{left:0} .divider::after{right:0}
        .link-register { text-align:center;font-size:.87rem;color:#64748b;margin-top:1rem; }
        .link-register a { color:#1a56db;font-weight:600;text-decoration:none; }
        .link-register a:hover { text-decoration:underline; }
        .alert { border-radius:10px;border:none;font-size:.88rem; }
    </style>
</head>
<body>
<div class="auth-page">
    <div class="auth-card">
        <div class="auth-logo">
            <div class="icon-wrap"><i class="bi bi-mortarboard-fill"></i></div>
            <h1>Portail Doctorat</h1>
            <p>Connectez-vous à votre espace</p>
        </div>

        <!-- Messages flash -->
        <div th:if="${errorMessage}" class="alert alert-danger d-flex align-items-center gap-2 mb-3">
            <i class="bi bi-x-circle-fill"></i> <span th:text="${errorMessage}"></span>
        </div>
        <div th:if="${logoutMessage}" class="alert alert-success d-flex align-items-center gap-2 mb-3">
            <i class="bi bi-check-circle-fill"></i> <span th:text="${logoutMessage}"></span>
        </div>
        <!-- Message flash après inscription réussie -->
        <div th:if="${successMessage}" class="alert alert-success d-flex align-items-center gap-2 mb-3">
            <i class="bi bi-check-circle-fill"></i> <span th:text="${successMessage}"></span>
        </div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label class="form-label" for="username"><i class="bi bi-envelope me-1"></i>Adresse email</label>
                <input type="email" id="username" name="username" class="form-control"
                       placeholder="votre@email.com" required autofocus/>
            </div>
            <div class="mb-4">
                <label class="form-label" for="password"><i class="bi bi-lock me-1"></i>Mot de passe</label>
                <input type="password" id="password" name="password" class="form-control"
                       placeholder="••••••••" required/>
            </div>
            <button type="submit" class="btn-login">
                <i class="bi bi-box-arrow-in-right me-2"></i>Se connecter
            </button>
        </form>

        <div class="divider">ou</div>
        <div class="link-register">
            Pas encore de compte ? <a th:href="@{/register}">Créer un compte</a>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
