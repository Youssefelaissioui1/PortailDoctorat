<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Créer un compte — Portail Doctorat</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet"/>
    <style>
        body { font-family:'DM Sans',sans-serif;margin:0; }
        h1,h2,h3 { font-family:'Sora',sans-serif; }
        .auth-page {
            min-height:100vh;
            background:linear-gradient(135deg,#1a56db 0%,#0ea5e9 100%);
            display:flex;align-items:center;justify-content:center;
            padding:2rem 1rem;
        }
        .auth-card {
            background:#fff;border-radius:20px;padding:2.5rem 2.25rem;
            width:100%;max-width:520px;
            box-shadow:0 24px 60px rgba(0,0,0,.2);
        }
        .auth-logo { text-align:center;margin-bottom:1.5rem; }
        .auth-logo .icon-wrap {
            width:56px;height:56px;background:linear-gradient(135deg,#1a56db,#0ea5e9);
            border-radius:14px;display:inline-flex;align-items:center;justify-content:center;
            font-size:1.5rem;color:#fff;margin-bottom:.6rem;
        }
        .auth-logo h1 { font-size:1.2rem;font-weight:700;margin:0; }
        .auth-logo p  { font-size:.83rem;color:#64748b;margin:.2rem 0 0; }
        .form-label { font-size:.84rem;font-weight:500;color:#374151;margin-bottom:.3rem; }
        .form-control,.form-select {
            border-radius:9px;border:1.5px solid #e2e8f0;padding:.6rem .85rem;font-size:.88rem;
            transition:border-color .2s,box-shadow .2s;
        }
        .form-control:focus,.form-select:focus {
            border-color:#1a56db;box-shadow:0 0 0 3px rgba(26,86,219,.12);outline:none;
        }
        .form-control.is-invalid { border-color:#dc2626; }
        .invalid-feedback { font-size:.8rem;color:#dc2626; }
        .section-title {
            font-family:'Sora',sans-serif;font-size:.82rem;font-weight:700;
            text-transform:uppercase;letter-spacing:.07em;color:#94a3b8;
            margin:1.4rem 0 .75rem;padding-bottom:.4rem;border-bottom:1px solid #e2e8f0;
        }
        .btn-register {
            width:100%;background:linear-gradient(135deg,#1a56db,#0ea5e9);
            border:none;color:#fff;border-radius:10px;padding:.72rem;
            font-size:.93rem;font-weight:600;font-family:'Sora',sans-serif;
            cursor:pointer;transition:opacity .2s;margin-top:.5rem;
        }
        .btn-register:hover { opacity:.9; }
        .link-login { text-align:center;font-size:.86rem;color:#64748b;margin-top:1rem; }
        .link-login a { color:#1a56db;font-weight:600;text-decoration:none; }
        .alert { border-radius:10px;border:none;font-size:.87rem; }
    </style>
</head>
<body>
<div class="auth-page">
    <div class="auth-card">
        <div class="auth-logo">
            <div class="icon-wrap"><i class="bi bi-mortarboard-fill"></i></div>
            <h1>Créer un compte</h1>
            <p>Inscription au Portail de suivi du doctorat</p>
        </div>

        <form th:action="@{/register}" method="post" th:object="${doctorant}" novalidate>

            <!-- Infos personnelles -->
            <div class="section-title"><i class="bi bi-person me-1"></i>Informations personnelles</div>
            <div class="row g-3">
                <div class="col-6">
                    <label class="form-label">Nom *</label>
                    <input type="text" th:field="*{nom}" class="form-control"
                           th:classappend="${#fields.hasErrors('nom')} ? 'is-invalid'" placeholder="Alami"/>
                    <div class="invalid-feedback" th:errors="*{nom}"></div>
                </div>
                <div class="col-6">
                    <label class="form-label">Prénom *</label>
                    <input type="text" th:field="*{prenom}" class="form-control"
                           th:classappend="${#fields.hasErrors('prenom')} ? 'is-invalid'" placeholder="Youssef"/>
                    <div class="invalid-feedback" th:errors="*{prenom}"></div>
                </div>
                <div class="col-12">
                    <label class="form-label">Email *</label>
                    <input type="email" th:field="*{email}" class="form-control"
                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'" placeholder="youssef@univ.ma"/>
                    <div class="invalid-feedback" th:errors="*{email}"></div>
                </div>
                <div class="col-12">
                    <label class="form-label">Mot de passe *</label>
                    <input type="password" th:field="*{motDePasse}" class="form-control"
                           th:classappend="${#fields.hasErrors('motDePasse')} ? 'is-invalid'" placeholder="Min. 8 caractères"/>
                    <div class="invalid-feedback" th:errors="*{motDePasse}"></div>
                </div>
            </div>

            <!-- Infos doctorat -->
            <div class="section-title"><i class="bi bi-book me-1"></i>Informations doctorat</div>
            <div class="row g-3">
                <div class="col-12">
                    <label class="form-label">CNE *</label>
                    <input type="text" th:field="*{cne}" class="form-control"
                           th:classappend="${#fields.hasErrors('cne')} ? 'is-invalid'" placeholder="CNE123456"/>
                    <div class="invalid-feedback" th:errors="*{cne}"></div>
                </div>
                <div class="col-12">
                    <label class="form-label">Sujet de thèse *</label>
                    <textarea th:field="*{sujetThese}" class="form-control" rows="2"
                              th:classappend="${#fields.hasErrors('sujetThese')} ? 'is-invalid'"
                              placeholder="Décrivez brièvement votre sujet de recherche..."></textarea>
                    <div class="invalid-feedback" th:errors="*{sujetThese}"></div>
                </div>
                <div class="col-6">
                    <label class="form-label">Laboratoire</label>
                    <input type="text" th:field="*{laboratoire}" class="form-control" placeholder="LRIT, LISAC..."/>
                </div>
                <div class="col-6">
                    <label class="form-label">Spécialité</label>
                    <input type="text" th:field="*{specialite}" class="form-control" placeholder="Informatique..."/>
                </div>
                <div class="col-12">
                    <label class="form-label">Date de première inscription *</label>
                    <input type="date" th:field="*{datePremiereInscription}" class="form-control"
                           th:classappend="${#fields.hasErrors('datePremiereInscription')} ? 'is-invalid'"/>
                    <div class="invalid-feedback" th:errors="*{datePremiereInscription}"></div>
                </div>
            </div>

            <button type="submit" class="btn-register mt-3">
                <i class="bi bi-person-plus-fill me-2"></i>Créer mon compte
            </button>
        </form>

        <div class="link-login">Déjà un compte ? <a th:href="@{/login}">Se connecter</a></div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
