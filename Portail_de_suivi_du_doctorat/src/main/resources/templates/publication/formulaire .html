<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Nouvelle publication — Portail Doctorat</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet"/>
    <style>
        :root{--primary:#1a56db;--bg:#f8fafc;--card:#fff;--border:#e2e8f0;--text:#0f172a;--muted:#64748b;--sidebar-w:240px;}
        *{box-sizing:border-box;}body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);margin:0;}
        h1,h2,h3,.brand{font-family:'Sora',sans-serif;}
        .topbar{position:fixed;top:0;left:0;right:0;z-index:1040;height:58px;background:var(--primary);display:flex;align-items:center;padding:0 1.25rem;gap:1rem;box-shadow:0 1px 8px rgba(0,0,0,.18);}
        .topbar .brand{font-weight:700;font-size:1.1rem;color:#fff;text-decoration:none;}.topbar .brand span{color:#93c5fd;}
        .btn-logout{background:rgba(255,255,255,.18);border:none;color:#fff;border-radius:8px;padding:.3rem .75rem;font-size:.82rem;cursor:pointer;}
        .sidebar{position:fixed;top:58px;left:0;bottom:0;width:var(--sidebar-w);background:var(--card);border-right:1px solid var(--border);overflow-y:auto;padding:1rem 0;z-index:1030;}
        .nav-section{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:.6rem 1.2rem .25rem;}
        .sidebar a.nav-link{display:flex;align-items:center;gap:.65rem;padding:.52rem 1.2rem;color:var(--text);font-size:.88rem;text-decoration:none;transition:background .15s;}
        .sidebar a.nav-link i{font-size:1rem;color:var(--muted);}
        .sidebar a.nav-link:hover{background:#eff6ff;color:var(--primary);}
        .sidebar a.nav-link.active{background:#dbeafe;color:var(--primary);font-weight:600;border-left:3px solid var(--primary);}
        .sidebar a.nav-link.active i{color:var(--primary);}
        .main-content{margin-left:var(--sidebar-w);margin-top:58px;padding:2rem;}
        .card{border:1px solid var(--border);border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,.06);}
        .card-header{background:var(--card);border-bottom:1px solid var(--border);font-family:'Sora',sans-serif;font-weight:600;}
        .form-label{font-size:.84rem;font-weight:500;color:#374151;margin-bottom:.3rem;}
        .form-control,.form-select{border-radius:9px;border:1.5px solid var(--border);padding:.6rem .85rem;font-size:.88rem;transition:border-color .2s;}
        .form-control:focus,.form-select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(26,86,219,.12);outline:none;}
        .section-title{font-family:'Sora',sans-serif;font-size:.82rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:#94a3b8;margin:1.2rem 0 .75rem;padding-bottom:.4rem;border-bottom:1px solid var(--border);}
        .alert{border-radius:10px;border:none;font-size:.88rem;}
        .page-header{margin-bottom:1.75rem;}
        .page-header h1{font-size:1.45rem;font-weight:700;margin:0;}
    </style>
</head>
<body>
<div class="topbar">
    <a href="/" class="brand"><i class="bi bi-mortarboard-fill me-2"></i>Portail<span>Doctorat</span></a>
    <div class="ms-auto">
        <form th:action="@{/logout}" method="post" class="m-0">
            <button type="submit" class="btn-logout"><i class="bi bi-box-arrow-right"></i> Quitter</button>
        </form>
    </div>
</div>
<div class="sidebar">
    <div class="nav-section">Mon espace</div>
    <a th:href="@{/doctorant/dashboard}"   class="nav-link"><i class="bi bi-speedometer2"></i> Tableau de bord</a>
    <a th:href="@{/doctorant/progression}" class="nav-link"><i class="bi bi-graph-up-arrow"></i> Progression</a>
    <div class="nav-section">Activités</div>
    <a th:href="@{/publications}" class="nav-link active"><i class="bi bi-journal-richtext"></i> Publications</a>
    <a th:href="@{/formations}"   class="nav-link"><i class="bi bi-book"></i> Formations</a>
</div>
<div class="main-content">
    <div class="mb-3"><a th:href="@{/publications}" class="btn btn-sm btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i>Retour</a></div>
    <div class="page-header">
        <h1>Nouvelle publication</h1>
        <p>Déclarez une publication pour validation administrative</p>
    </div>

    <div th:if="${errorMessage}" class="alert alert-danger d-flex align-items-center gap-2 mb-3">
        <i class="bi bi-x-circle-fill"></i><span th:text="${errorMessage}"></span>
    </div>

    <div class="card">
        <div class="card-header p-3"><i class="bi bi-journal-plus me-2"></i>Informations de la publication</div>
        <div class="card-body p-4">
            <form th:action="@{/publications}" method="post" th:object="${publication}">
                <div class="section-title"><i class="bi bi-file-text me-1"></i>Détails</div>
                <div class="row g-3">
                    <div class="col-12">
                        <label class="form-label">Titre *</label>
                        <input type="text" th:field="*{titre}" class="form-control" placeholder="Titre complet de la publication" required/>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Type *</label>
                        <select th:field="*{type}" class="form-select" required>
                            <option value="">-- Sélectionner --</option>
                            <option th:each="t : ${types}" th:value="${t}" th:text="${t}"></option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Quartile (pour articles)</label>
                        <select th:field="*{quartile}" class="form-select">
                            <option value="">-- Aucun / N/A --</option>
                            <option th:each="q : ${quartiles}" th:value="${q}" th:text="${q}"></option>
                        </select>
                    </div>
                    <div class="col-md-8">
                        <label class="form-label">Revue / Conférence *</label>
                        <input type="text" th:field="*{revueOuConference}" class="form-control" placeholder="Nom de la revue ou de la conférence" required/>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Année *</label>
                        <input type="number" th:field="*{annee}" class="form-control" placeholder="2024" min="2000" max="2099" required/>
                    </div>
                    <div class="col-12">
                        <label class="form-label">DOI / URL</label>
                        <input type="text" th:field="*{doi}" class="form-control" placeholder="https://doi.org/..."/>
                    </div>
                </div>

                <div class="d-flex gap-2 mt-4">
                    <button type="submit" class="btn btn-primary px-4"><i class="bi bi-send me-2"></i>Soumettre</button>
                    <a th:href="@{/publications}" class="btn btn-outline-secondary">Annuler</a>
                </div>
            </form>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
